title: "zbikow.ski"
description: "Matthew Zbikowski's personal blog"
author: "Matthew Zbikowski"
baseurl: ""
url: "https://zbikow.ski"

permalink: /:year/:month/:day/:title/
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: "_posts/drafts"
      type: "posts"
    values:
      published: false
  - scope:
      path: "_posts/archive"
      type: "posts"
    values:
      archived: true
