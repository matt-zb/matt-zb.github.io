<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Cormorant+Display:ital,wght@0,300..700;1,300..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} nav-current{% endif %}">Home</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.url contains 'about' %} nav-current{% endif %}">About</a>
      <a href="#" class="nav-link" id="nav-random">Random</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>


  <script>
    // Classify external links and set up the analog highlighter effect.
    document.querySelectorAll('main a').forEach(function (el) {
      const href = el.getAttribute('href');
      if (!href) return;
      if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) {
        el.classList.add('external', 'hl');
        el.dataset.pressure = Math.ceil(Math.random() * 3);

        el.addEventListener('mouseenter', function () {
          el.classList.remove('is-leaving');
          el.classList.add('is-entering');
        });
        el.addEventListener('mouseleave', function () {
          el.classList.remove('is-entering');
          el.classList.add('is-leaving');
        });
      }
    });

    // Random page navigation
    var sitePostUrls = [{% assign visible_posts = site.posts | where_exp: "post", "post.archived != true" %}{% for post in visible_posts %}"{{ post.url | relative_url }}"{% unless forloop.last %},{% endunless %}{% endfor %}];
    document.getElementById('nav-random').addEventListener('click', function (e) {
      e.preventDefault();
      if (sitePostUrls.length)
        window.location.href = sitePostUrls[Math.floor(Math.random() * sitePostUrls.length)];
    });

    // Heading anchor links (¶) for h2 and h3 inside post content
    document.querySelectorAll('.post-content h2, .post-content h3').forEach(function (heading) {
      if (!heading.id) {
        heading.id = heading.textContent
          .toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .trim()
          .replace(/\s+/g, '-');
      }
      var anchor = document.createElement('a');
      anchor.href = '#' + heading.id;
      anchor.className = 'heading-anchor';
      anchor.setAttribute('aria-hidden', 'true');
      anchor.textContent = '§';
      heading.appendChild(anchor);
    });
  </script>

  <script>
    // Tufte-style sidenotes and margin notes.
    // Transforms kramdown footnotes into right-margin floats.
    //   Sidenotes:    [^label]       — numbered, anchored in text
    //   Margin notes: [^mn-label]    — unnumbered, no in-text marker
    (function () {
      var postContent = document.querySelector('.post-content');
      if (!postContent) return;
      var footnotesDiv = postContent.querySelector('.footnotes');
      if (!footnotesDiv) return;

      // Build map: footnote li id → { html, isMarginNote }
      var fnData = {};
      footnotesDiv.querySelectorAll('li[id]').forEach(function (li) {
        var clone = li.cloneNode(true);
        var backref = clone.querySelector('.reversefootnote');
        if (backref) backref.parentNode.removeChild(backref);
        var isMn = li.id.indexOf('fn:mn-') === 0;
        fnData[li.id] = { html: clone.innerHTML.trim(), isMarginNote: isMn };
        if (isMn) li.classList.add('mn-item');
      });

      // Sidenote-only counter (margin notes are not counted)
      var snCounter = 0;
      // Maps footnote li id → sidenote number, used to fix narrow-screen list
      var fnNumMap = {};

      // Insert a .sidenote or .marginnote span after each <sup> reference
      postContent.querySelectorAll('sup[id^="fnref"]').forEach(function (sup) {
        var a = sup.querySelector('a[href]');
        if (!a) return;
        var targetId = a.getAttribute('href').replace(/^#/, '');
        var data = fnData[targetId];
        if (!data) return;

        var sn = document.createElement('span');
        if (data.isMarginNote) {
          sn.className = 'marginnote';
          sup.classList.add('mn-ref');
        } else {
          snCounter++;
          sn.className = 'sidenote';
          sn.dataset.num = snCounter;
          // Sync in-text sup to show sidenote-only number (not kramdown's sequential)
          a.textContent = snCounter;
          fnNumMap[targetId] = snCounter;
        }
        sn.innerHTML = data.html;
        sup.parentNode.insertBefore(sn, sup.nextSibling);
      });

      // Set explicit list-item values on the footnotes <ol> so narrow-screen
      // numbers match the sidenote-only counter (margin notes are skipped).
      footnotesDiv.querySelectorAll('li[id]').forEach(function (li) {
        if (fnNumMap[li.id] !== undefined) {
          li.setAttribute('value', fnNumMap[li.id]);
        }
      });
    })();
  </script>

</body>
</html>
