<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Cormorant+Display:ital,wght@0,300..700;1,300..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- Hidden SVG filter for analog highlight effect (place once, referenced via CSS) -->
  <svg class="svg-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <filter id="highlight-texture" x="-5%" y="-20%" width="110%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025 0.4"
                      numOctaves="2" seed="2" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise"
                           scale="5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="site-title">{{ site.title }}</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <span class="footer-year">{{ site.time | date: '%Y' }}</span>
      &thinsp;·&thinsp;
      {{ site.author }}
    </p>
  </footer>

  <script>
    // Classify links: external get highlight effect, internal get small-caps treatment
    document.querySelectorAll('main a').forEach(function (el) {
      var href = el.getAttribute('href');
      if (!href) return;
      if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) {
        el.classList.add('external');
      }
    });

    // Random pressure variation per external link (drives slight SVG filter variation)
    document.querySelectorAll('a.external').forEach(function (el) {
      el.dataset.pressure = Math.floor(Math.random() * 3);
    });
  </script>

</body>
</html>
