<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=Cormorant+Display:ital,wght@0,300..700;1,300..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- SVG filter for analog highlight effect — applied only to the highlight layer, never the text -->
  <svg class="svg-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs>
      <filter id="hl-filter" x="-10%" y="-35%" width="120%" height="170%" color-interpolation-filters="sRGB">
        <!-- Noise for organic edge displacement -->
        <feTurbulence type="fractalNoise" baseFrequency="0.04 0.28" numOctaves="3" seed="7" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"
                           xChannelSelector="R" yChannelSelector="G" result="displaced"/>
        <!-- Second noise layer for subtle color/density variation (pressure feel) -->
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.08" numOctaves="2" seed="13" result="pressureNoise"/>
        <feColorMatrix type="matrix" in="pressureNoise"
          values="0 0 0 0 0.12
                  0 0 0 0 0.08
                  0 0 0 0 0
                  0 0 0 0.18 0" result="tint"/>
        <feComposite in="tint" in2="displaced" operator="over"/>
      </filter>
    </defs>
  </svg>

  <header class="site-header">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} nav-current{% endif %}">Home</a>
      <a href="{{ '/about/' | relative_url }}" class="nav-link{% if page.url contains 'about' %} nav-current{% endif %}">About</a>
      <a href="#" class="nav-link" id="nav-random">Random</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <span class="footer-year">{{ site.time | date: '%Y' }}</span>
      &thinsp;·&thinsp;
      {{ site.author }}
    </p>
  </footer>

  <script>
    // Classify links and set up the analog highlighter effect.
    // The highlight is applied to a .hl-wrap span around the TEXT ONLY —
    // the ↗ arrow lives outside the span so it is never highlighted.
    document.querySelectorAll('main a').forEach(function (el) {
      const href = el.getAttribute('href');
      if (!href) return;
      if (href.startsWith('http://') || href.startsWith('https://') || href.startsWith('//')) {
        el.classList.add('external');

        // Wrap all child nodes (text + inline children) in a span; ::after arrow stays on el
        var wrap = document.createElement('span');
        wrap.className = 'hl-wrap';
        while (el.firstChild) wrap.appendChild(el.firstChild);
        el.appendChild(wrap);

        // Wipe-in and wipe-out both travel left → right via separate @keyframes
        el.addEventListener('mouseenter', function () {
          wrap.classList.remove('hl-out');
          // Force a reflow so removing hl-out before adding hl-in restarts the animation
          void wrap.offsetWidth;
          wrap.classList.add('hl-in');
        });
        el.addEventListener('mouseleave', function () {
          wrap.classList.remove('hl-in');
          void wrap.offsetWidth;
          wrap.classList.add('hl-out');
        });
      }
    });

    // Random page navigation
    var sitePostUrls = [{% for post in site.posts %}"{{ post.url | relative_url }}"{% unless forloop.last %},{% endunless %}{% endfor %}];
    document.getElementById('nav-random').addEventListener('click', function (e) {
      e.preventDefault();
      if (sitePostUrls.length)
        window.location.href = sitePostUrls[Math.floor(Math.random() * sitePostUrls.length)];
    });

    // Heading anchor links (¶) for h2 and h3 inside post content
    document.querySelectorAll('.post-content h2, .post-content h3').forEach(function (heading) {
      if (!heading.id) {
        heading.id = heading.textContent
          .toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .trim()
          .replace(/\s+/g, '-');
      }
      var anchor = document.createElement('a');
      anchor.href = '#' + heading.id;
      anchor.className = 'heading-anchor';
      anchor.setAttribute('aria-hidden', 'true');
      anchor.textContent = '¶';
      heading.appendChild(anchor);
    });
  </script>

</body>
</html>
