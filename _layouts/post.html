---
layout: base
---

<article class="post">
  <header class="post-header">
    <div class="post-meta">
      <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
        {{ page.date | date: '%B %-d, %Y' }}
      </time>
      <span class="post-reading-time">{{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
    </div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
